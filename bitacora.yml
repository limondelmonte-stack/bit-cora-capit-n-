name: Compilar APK Bitacora

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Configurar Java / JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias del proyecto
        run: npm install

      - name: Inicializar Capacitor y sincronizar Android
        run: |
          npx cap init "Bitacora del Capitan" com.capitan.bitacora --web-dir www --yes
          npx cap add android
          npx cap sync android

      - name: Compilar APK de Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar archivo APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Bitacora-Capitan-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
